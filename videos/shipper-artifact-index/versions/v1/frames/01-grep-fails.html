    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        "use strict";

        var root = document.getElementById("root");
        var stage = document.getElementById("f01-grep-fails-stage");
        var commandElement = document.getElementById("f01-grep-fails-command");
        var payoff = document.getElementById("f01-grep-fails-payoff");
        var outputElements = Array.prototype.slice.call(
          root.querySelectorAll('[class="f01-grep-fails-out"]'),
        );

        var TYPE_START = 0.42;
        var TYPE_END = 2.42;
        var EXEC_AT = 2.6;
        var OUT_START = 2.78;
        var OUT_STEP = 0.2;
        var PRINT = 0.12;
        var COLLAPSE_AT = 5.0;
        var COLLAPSE_DUR = 0.32;
        var POP_AT = 5.34;
        var POP_DUR = 0.42;

        var textNodes = [];
        var walker = document.createTreeWalker(commandElement, NodeFilter.SHOW_TEXT, null);
        while (walker.nextNode()) {
          textNodes.push({ node: walker.currentNode, full: walker.currentNode.data });
        }
        var fullText = textNodes
          .map(function (entry) {
            return entry.full;
          })
          .join("");

        function showChars(count) {
          var remaining = count;
          for (var i = 0; i < textNodes.length; i += 1) {
            var entry = textNodes[i];
            var take = Math.min(entry.full.length, Math.max(0, remaining));
            entry.node.data = entry.full.slice(0, take);
            remaining -= entry.full.length;
          }
        }

        var caretElement = document.createElement("span");
        caretElement.className = "f01-grep-fails-caret";
        caretElement.setAttribute("aria-hidden", "true");
        commandElement.appendChild(caretElement);

        var rows = [{ t: 0, n: 0 }];
        var weights = [];
        var weightSum = 0;
        var c;
        for (c = 0; c < fullText.length; c += 1) {
          var weight = fullText.charAt(c) === " " ? 2 : 1;
          weights.push(weight);
          weightSum += weight;
        }
        var acc = TYPE_START;
        var span = TYPE_END - TYPE_START;
        for (c = 0; c < fullText.length; c += 1) {
          acc += (weights[c] / weightSum) * span;
          rows.push({ t: acc, n: c + 1 });
        }

        function charsAt(time) {
          for (var i = rows.length - 1; i >= 0; i -= 1) {
            if (time >= rows[i].t - 0.001) return rows[i].n;
          }
          return 0;
        }

        showChars(0);

        var tl = gsap.timeline({ paused: true });

        tl.fromTo(
          stage,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
          0,
        );

        var typeDriver = { t: 0 };
        tl.to(
          typeDriver,
          {
            t: TYPE_END,
            duration: TYPE_END,
            ease: "none",
            onUpdate: function () {
              showChars(charsAt(typeDriver.t));
            },
          },
          0,
        );

        var blinkCycles = Math.max(1, Math.round(TYPE_END / 0.85));
        var blink = { p: 0 };
        tl.to(
          blink,
          {
            p: Math.PI * 2 * blinkCycles,
            duration: TYPE_END,
            ease: "none",
            onUpdate: function () {
              caretElement.style.opacity = Math.sin(blink.p) >= 0 ? "1" : "0";
            },
          },
          0,
        );
        tl.set(caretElement, { opacity: 1 }, TYPE_END);
        tl.set(caretElement, { opacity: 0 }, EXEC_AT);

        outputElements.forEach(function (element, index) {
          tl.fromTo(
            element,
            { opacity: 0 },
            { opacity: 1, duration: PRINT, ease: "none", immediateRender: true },
            OUT_START + index * OUT_STEP,
          );
        });

        tl.fromTo(
          stage,
          { scale: 1, opacity: 1 },
          {
            scale: 0,
            opacity: 0,
            duration: COLLAPSE_DUR,
            ease: "power2.in",
            immediateRender: false,
          },
          COLLAPSE_AT,
        );

        tl.fromTo(
          payoff,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: POP_DUR, ease: "power3.out" },
          POP_AT,
        );

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["01-grep-fails"] = tl;
      })();
    </script>
