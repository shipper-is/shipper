    <script>
      (function () {
        "use strict";

        var script = document.currentScript;
        var root = script && script.closest ? script.closest("#root") : null;
        if (!root || root.getAttribute("data-composition-id") !== "02-index-hits") {
          root = document.querySelector('[data-composition-id="02-index-hits"]');
        }
        if (!root || typeof gsap === "undefined") return;

        var TYPE_START = 1.2;
        var TYPE_END = 4.4;
        var STATUS_IN = 4.4;
        var STATUS_IN_DUR = 0.12;
        var STATUS_OUT = 5.55;
        var STATUS_OUT_DUR = 0.18;
        var RESULT_AT = 6.2;
        var DURATION = 10;

        var stage = root.querySelector('[data-role="stage"]');
        var commandElement = root.querySelector('[data-terminal="command"]');
        var statusEl = root.querySelector('[data-role="status"]');
        var resultEl = root.querySelector('[data-role="result"]');
        var tailEl = root.querySelector('[data-role="tail"]');
        var tailCaret = tailEl ? tailEl.querySelector('[data-role="caret"]') : null;

        var textNodes = [];
        if (commandElement) {
          var walker = document.createTreeWalker(commandElement, NodeFilter.SHOW_TEXT, null);
          while (walker.nextNode()) {
            textNodes.push({ node: walker.currentNode, full: walker.currentNode.data });
          }
        }
        var fullText = textNodes
          .map(function (entry) {
            return entry.full;
          })
          .join("");

        function showChars(count) {
          var remaining = count;
          for (var i = 0; i < textNodes.length; i += 1) {
            var entry = textNodes[i];
            var take = Math.min(entry.full.length, Math.max(0, remaining));
            entry.node.data = entry.full.slice(0, take);
            remaining -= entry.full.length;
          }
        }

        var commandCaret = null;
        if (commandElement) {
          commandCaret = document.createElement("span");
          commandCaret.className = "f02-index-hits-caret";
          commandCaret.setAttribute("data-role", "caret");
          commandCaret.setAttribute("aria-hidden", "true");
          commandElement.appendChild(commandCaret);
        }
        if (stage) stage.setAttribute("aria-label", ("$ " + fullText).trim());

        var rows = [
          { t: 0, n: 0 },
          { t: TYPE_START, n: 0 },
        ];
        var charCount = fullText.length;
        var typeSpan = TYPE_END - TYPE_START;
        for (var c = 1; c <= charCount; c += 1) {
          rows.push({
            t: c === charCount ? TYPE_END : TYPE_START + (typeSpan * c) / charCount,
            n: c,
          });
        }

        function charsAt(time) {
          for (var i = rows.length - 1; i >= 0; i -= 1) {
            if (time >= rows[i].t - 0.001) return rows[i].n;
          }
          return 0;
        }

        function caretOn(time, start, end) {
          var span = end - start;
          var cycles = Math.max(1, Math.round(span / 0.9));
          var p = ((time - start) / span) * Math.PI * 2 * cycles;
          return Math.sin(p) >= 0;
        }

        function statusOpacity(time) {
          if (time < STATUS_IN) return 0;
          if (time < STATUS_IN + STATUS_IN_DUR) return (time - STATUS_IN) / STATUS_IN_DUR;
          if (time < STATUS_OUT) return 1;
          if (time < STATUS_OUT + STATUS_OUT_DUR) {
            return 1 - (time - STATUS_OUT) / STATUS_OUT_DUR;
          }
          return 0;
        }

        function apply(time) {
          showChars(charsAt(time));
          if (commandCaret) {
            commandCaret.style.opacity =
              time >= TYPE_END ? "0" : caretOn(time, 0, TYPE_END) ? "1" : "0";
          }
          if (statusEl) statusEl.style.opacity = String(statusOpacity(time));
          if (tailCaret) {
            tailCaret.style.opacity =
              time >= RESULT_AT ? (caretOn(time, RESULT_AT, DURATION) ? "1" : "0") : "0";
          }
        }

        apply(0);

        );

        );

        window.__timelines = window.__timelines || {};
        window.__timelines["02-index-hits"] = tl;
