<template>
  <style>
    @font-face{font-family:"Geist";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/Geist-Regular.woff2") format("woff2");}
    @font-face{font-family:"Geist Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistMono-Regular.woff2") format("woff2");}
    @font-face{font-family:"Geist Mono";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/GeistMono-Medium.woff2") format("woff2");}

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      container-type: size;
      color: #ffffff;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    #install-ground {
      background: #000000;
    }

    #install-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 300px;
      margin: 0;
      text-align: center;
      font-family: "Geist";
      font-weight: 400;
      font-size: 88px;
      line-height: 1.05;
      letter-spacing: -0.025em;
      white-space: nowrap;
      opacity: 0;
    }

    #install-pill {
      position: absolute;
      left: 560px;
      top: 500px;
      width: 800px;
      height: 96px;
      background: #111111;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      padding: 0 40px;
      display: flex;
      align-items: center;
      font-family: "Geist Mono";
      font-weight: 400;
      font-size: 40px;
      white-space: pre;
      opacity: 0;
    }

    #install-glyph {
      color: rgba(255, 255, 255, 0.5);
      margin-right: 22px;
    }

    .install-ch {
      display: none;
    }

    #install-caret {
      display: inline-block;
      width: 20px;
      height: 44px;
      margin-left: 4px;
      background: #ffffff;
    }

    #install-note {
      position: absolute;
      left: 0;
      right: 0;
      top: 650px;
      margin: 0;
      text-align: center;
      font-family: "Geist Mono";
      font-size: 26px;
      color: rgba(255, 255, 255, 0.6);
      opacity: 0;
    }

    #install-url {
      position: absolute;
      left: 0;
      right: 0;
      top: 704px;
      margin: 0;
      text-align: center;
      font-family: "Geist Mono";
      font-weight: 500;
      font-size: 26px;
      color: #ffffff;
      opacity: 0;
    }
  </style>

  <div id="root" data-composition-id="02-install" data-width="1920" data-height="1080" data-duration="6">
    <div id="install-ground" class="clip" data-start="0" data-duration="6" data-track-index="0"></div>

    <div id="install-stage" class="clip" data-start="0" data-duration="6" data-track-index="1">
      <p id="install-line">Every plan you ship teaches the next one.</p>
      <div id="install-pill"><span id="install-glyph">$</span><span id="install-cmd"></span><span id="install-caret"></span></div>
      <p id="install-note">Local search across plans, spikes, bugs, and reviews.</p>
      <p id="install-url">shipper.is</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var COMMAND = "shipper mcp install";
      var line = document.getElementById("install-line");
      var pill = document.getElementById("install-pill");
      var cmd = document.getElementById("install-cmd");
      var caret = document.getElementById("install-caret");
      var note = document.getElementById("install-note");
      var url = document.getElementById("install-url");

      for (var i = 0; i < COMMAND.length; i += 1) {
        var ch = document.createElement("span");
        ch.className = "install-ch";
        ch.textContent = COMMAND.charAt(i);
        cmd.appendChild(ch);
      }
      var chars = cmd.querySelectorAll(".install-ch");

      var tl = gsap.timeline({ paused: true });

      tl.fromTo(line, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.15);
      tl.fromTo(
        pill,
        { opacity: 0, scaleX: 0.55, transformOrigin: "50% 50%" },
        { opacity: 1, scaleX: 1, duration: 0.55, ease: "power3.out" },
        1.4
      );

      var t = 1.95;
      for (var k = 0; k < chars.length; k += 1) {
        tl.set(chars[k], { display: "inline" }, t);
        t += COMMAND.charAt(k) === " " ? 0.12 : 0.07;
      }
      tl.fromTo(
        caret,
        { opacity: 1 },
        { opacity: 0, duration: 0.45, ease: "steps(1)", repeat: 5, yoyo: true, immediateRender: false },
        3.4
      );

      tl.fromTo(note, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 3.7);
      tl.fromTo(url, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 4.1);

      tl.set({}, {}, 6);
      window.__timelines = window.__timelines || {};
      window.__timelines["02-install"] = tl;
    })();
  </script>
</template>
